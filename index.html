<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grawlix Games</title>
<meta name="description" content="Grawlix Games — an independent game studio. Coming soon.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110f;
    --fg: #f2ead8;
    --muted: #9c917c;
    --accent: #e8a33d;
    --accent-2: #c8553d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Space Grotesk", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  main { max-width: 640px; width: 100%; text-align: center; }
  .grawlix {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: clamp(40px, 12vw, 88px);
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--accent);
    user-select: none;
  }
  .grawlix span { display: inline-block; transition: transform .2s ease, color .2s ease; }
  .grawlix span:nth-child(even) { color: var(--accent-2); }
  .grawlix:hover span { transform: translateY(-6px) rotate(-8deg); }
  .grawlix:hover span:nth-child(even) { transform: translateY(4px) rotate(10deg); }
  h1 {
    margin-top: 28px;
    font-size: clamp(32px, 7vw, 56px);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  p.tag {
    margin-top: 12px;
    color: var(--muted);
    font-size: clamp(16px, 2.6vw, 19px);
  }
  .soon {
    display: inline-block;
    margin-top: 36px;
    padding: 10px 18px;
    border: 1px solid var(--muted);
    border-radius: 999px;
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg);
  }
  footer {
    position: fixed; bottom: 16px; left: 0; right: 0;
    text-align: center; font-size: 12px; color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) {
    .grawlix span { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="grawlix" aria-hidden="true"><span>@</span><span>#</span><span>$</span><span>%</span><span>&amp;</span><span>!</span></div>
  <h1>Grawlix Games</h1>
  <p class="tag">An independent game studio.</p>
  <div class="soon">Coming soon</div>
</main>
<footer>&copy; <span id="y">2026</span> Grawlix Games</footer>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
