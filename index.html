<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holy Grawlix Games</title>
<meta name="description" content="Holy Grawlix Games is an independent game studio. Something's brewing.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B10">
<link rel="icon" type="image/svg+xml" href="brand/logo/holygrawlix-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="brand/icons/favicon-32.png">
<link rel="apple-touch-icon" href="brand/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0B10;--ink:#F4F1EA;--muted:#9D99A8;--yellow:#FFD23F;--red:#FF4D4D;--line:#26242F}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 0);background-size:22px 22px}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 16px;gap:28px}
  .tag{font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  /* Logo: three rows (HOLY / #$@! / GAMES) by default; one line once the window is wide enough. Never two rows. */
  h1{font-family:Bangers,Impact,sans-serif;font-weight:400;line-height:.9;letter-spacing:.02em;font-size:clamp(64px,15vw,200px);display:flex;flex-direction:column;flex-wrap:nowrap;justify-content:center;align-items:center;gap:.1em;padding:.12em 0}
  @media (min-width:900px){h1{flex-direction:row;gap:0 .25em;font-size:min(150px,calc((100vw - 64px) / 9))}}
  .burst{position:relative;display:inline-block;color:var(--bg);padding:.12em .32em .02em;transform:rotate(-4deg)}
  .burst::before{content:"";position:absolute;inset:-.08em -.06em;background:var(--yellow);border:4px solid var(--ink);z-index:-1;
    clip-path:polygon(0% 18%,9% 0%,24% 12%,38% 0%,52% 10%,66% 0%,80% 12%,93% 2%,100% 20%,94% 38%,100% 56%,94% 74%,100% 92%,84% 88%,70% 100%,56% 90%,42% 100%,28% 90%,14% 100%,4% 84%,0% 64%,6% 44%)}
  .burst span{display:inline-block;min-width:.55em;animation:jitter 2.4s steps(1) infinite}
  .burst span:nth-child(2){animation-delay:-.6s}.burst span:nth-child(3){animation-delay:-1.2s}.burst span:nth-child(4){animation-delay:-1.8s}
  @keyframes jitter{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-1px,2px) rotate(-6deg)}50%{transform:translate(2px,-1px) rotate(5deg)}75%{transform:translate(-2px,-2px) rotate(-3deg)}}
  .games{color:var(--ink)}
  .lead{max-width:560px;font-size:clamp(18px,2.4vw,22px);line-height:1.5;color:var(--muted)}
  .lead b{color:var(--ink);font-weight:700}
  .status{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.03)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,77,77,.6);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{to{box-shadow:0 0 0 12px rgba(255,77,77,0)}}
  footer{padding:24px 16px;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <p class="tag">Independent game studio</p>
  <h1 aria-label="Holy Grawlix Games"><span>Holy</span><span class="burst" aria-hidden="true"><span>#</span><span>$</span><span>@</span><span>!</span></span><span class="games">Games</span></h1>
  <p class="lead">Something's brewing. <b>Holy Grawlix Games</b> is building worlds worth swearing about. Watch this space.</p>
  <p class="status"><span class="dot" aria-hidden="true"></span>In development</p>
</main>
<footer>&copy; 2026 Holy Grawlix Games</footer>
<script>
  // Every so often, swap one symbol in the grawlix for another.
  (function () {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var chars = '#$@!%&*?', spans = document.querySelectorAll('.burst span');
    setInterval(function () {
      var s = spans[Math.floor(Math.random() * spans.length)], c;
      do { c = chars[Math.floor(Math.random() * chars.length)]; } while (c === s.textContent);
      s.textContent = c;
    }, 900);
  })();
</script>
</body>
</html>
